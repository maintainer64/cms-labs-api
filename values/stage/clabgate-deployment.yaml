apiVersion: apps/v1
kind: Deployment
metadata:
  name: clabgate
spec:
  replicas: 1
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app: clabgate
  template:
    metadata:
      labels:
        app: clabgate
    spec:
      containers:
        - name: app
          image: registry.gitlab.com/a10869/api-modules/clabgate/stage:${VERSION}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: clabgate-env-list
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "250Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /clabgate/api/docs/index.html
              port: http
            periodSeconds: 10
            initialDelaySeconds: 30
