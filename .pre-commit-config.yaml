repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
      - id: go-imports
      - id: no-go-testing
      - id: validate-toml
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.22.0
    hooks:
      - id: commitlint
        stages: [ commit-msg ]
        additional_dependencies: [ '@commitlint/config-conventional' ]

  - repo: local
    hooks:
      - id: front-lint
        name: front-lint
        entry: yarn --cwd nextui-dashboard lint
        language: system
        pass_filenames: false

      - id: front-types
        name: front-types
        entry: yarn --cwd nextui-dashboard types
        language: system
        pass_filenames: false

      - id: front-format
        name: front-format-check
        entry: yarn --cwd nextui-dashboard format:check
        language: system
        pass_filenames: false

exclude: |
  (?x)(
    migrations/|
    k8s/
  )
