version: '3'
services:
  db:
    platform: linux/x86_64
    container_name: cmslabs-db
    image: mysql:9.1
    restart: always
    environment:
      MYSQL_DATABASE: 'db'
      MYSQL_USER: 'user'
      MYSQL_PASSWORD: 'pnetlab'
      MYSQL_ROOT_PASSWORD: 'pnetlab'
      MYSQL_ROOT_HOST: '%'
    ports:
      - '3306:3306'
    volumes:
      - ./local_db:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  vault:
    platform: linux/x86_64
    image: hashicorp/vault:latest
    container_name: cmslabs-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-only-token-change-in-production
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: vault server -dev -dev-root-token-id=dev-only-token-change-in-production
    volumes:
      - ./vault_db:/vault/file

  # PostgreSQL
  postgresql:
    platform: linux/x86_64
    image: postgres:16-alpine
    container_name: cmslabs-postgresql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./postgresql_db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
