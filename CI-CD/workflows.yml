workflow:
  rules:
    - if: $CI_COMMIT_REF_SLUG == "stage"
      variables:
        TAG: stage
        DOCKER_PATH_BRANCH: stage
        K8S_CONFIG: ${K8S_CONFIG_STAGE}
        K8S_NAMESPACE: cmslabs
    - if: $CI_COMMIT_REF_SLUG == "master"
      variables:
        TAG: prod
        DOCKER_PATH_BRANCH: master
        SSH_USER: ${PROD_SSH_USER}
        SSH_HOST: ${PROD_SSH_HOST}
        SSH_PORT: ${PROD_SSH_PORT}
        SSH_PRIVATE_KEY: ${PROD_SSH_PRIVATE_KEY}
        K8S_CONFIG: ${K8S_CONFIG_PROD}
        K8S_NAMESPACE: cmslabs
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
