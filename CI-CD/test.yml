check-security:
  stage: test
  image: $BUILDER_GO_IMAGE
  script:
    - make security

check-pre-commit:
  stage: test
  extends: .dependencies
  image: $BUILDER_GO_IMAGE
  script:
    - make pre_commit

golang-test:
  stage: test
  extends: .dependencies
  image: $BUILDER_GO_IMAGE
  services:
    - name: mysql:9.1
      alias: mysqldatabase
      variables:
        MYSQL_HOST: 'mysqldatabase'
        MYSQL_DATABASE: 'db'
        MYSQL_USER: 'user'
        MYSQL_PASSWORD: 'pnetlab'
        MYSQL_ROOT_PASSWORD: 'pnetlab'
        MYSQL_ROOT_HOST: '%'
  after_script:
    - go tool cover -func coverage.out
    # Generate Cobertura coverage report for GitLab
    - gocover-cobertura -by-files < coverage.out > coverage.xml
    # Generate HTML coverage report
    - go tool cover -html coverage.out -o coverage.html
    # Generate JUnit report for GitLab
    - go-junit-report < tests.out > junit.xml
  coverage: '/total:\s+\(statements\)\s+\d+.\d+%/'
  artifacts:
    expose_as: 'Go Test Coverage Report'
    paths:
      - coverage.html
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: junit.xml
  script:
    - make -C backend migrate.up
    - make -C pnetlabaddon migrate.up
    - make test
