golang:
  stage: test
  image: golang:1.23
  before_script:
    - !reference [ .add_dependencies ]
  script:
    - export GO_COVER_PACKAGES=$(go list ./... | tr '\n' ',' | sed 's/,$//')
    -
  services:
    - name: mysql:9.1
      alias: db
      platform: linux/x86_64
      variables:
        MYSQL_DATABASE: 'db'
        MYSQL_USER: 'user'
        MYSQL_PASSWORD: 'pnetlab'
        MYSQL_ROOT_PASSWORD: 'password'
      command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
  after_script:
    # Generate Cobertura coverage report for GitLab
    - gocover-cobertura -by-files < coverage.out > coverage.xml
    # Generate HTML coverage report
    - go tool cover -html coverage.out -o coverage.html
    # Generate JUnit report for GitLab
    - go-junit-report < tests.txt > junit.xml
  coverage: '/total:\s+\(statements\)\s+\d+.\d+%/'
  artifacts:
    expose_as: 'Go Test Coverage Report'
    paths:
      - coverage.html
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: junit.xml