golang:
  stage: test
  extends: .dependencies
  image: golang:1.23
  services:
    - name: mysql:9.1
      alias: db
      variables:
        MYSQL_DATABASE: 'db'
        MYSQL_USER: 'user'
        MYSQL_PASSWORD: 'pnetlab'
        MYSQL_ROOT_PASSWORD: 'password'
  after_script:
    # Generate Cobertura coverage report for GitLab
    - gocover-cobertura -by-files < coverage.out > coverage.xml
    # Generate HTML coverage report
    - go tool cover -html coverage.out -o coverage.html
    # Generate JUnit report for GitLab
    - go-junit-report < tests.txt > junit.xml
  coverage: '/total:\s+\(statements\)\s+\d+.\d+%/'
  artifacts:
    expose_as: 'Go Test Coverage Report'
    paths:
      - coverage.html
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: junit.xml
  script:
    - rm -rf coverage.out
    - rm -rf coverage.xml
    - rm -rf coverage.html
    - rm -rf junit.xml
    - rm -rf tests.txt
    - make test
  retry: 2
