core-deploy:
  stage: deploy
  tags:
    - ${TAG}
  extends:
    - .deploy-base-ssh
    - .releases-branch
  image: ${DOCKER_IMAGE}
  needs:
    - core-build-docker
    - version
  environment:
    name: core-${CI_COMMIT_REF_SLUG}
  variables:
    FOLDER: core

clabgate-deploy:
  stage: deploy
  tags:
    - ${TAG}
  extends:
    - .deploy-base-ssh
    - .releases-branch
  image: ${DOCKER_IMAGE}
  needs:
    - clabgate-build-docker
    - version
  environment:
    name: clabgate-${CI_COMMIT_REF_SLUG}
  variables:
    FOLDER: clabgate

frontend-deploy:
  stage: deploy
  tags:
    - ${TAG}
  extends:
    - .deploy-base-ssh
    - .releases-branch
  image: ${DOCKER_IMAGE}
  needs:
    - frontend-build-docker
    - version
  environment:
    name: front-${CI_COMMIT_REF_SLUG}
  variables:
    FOLDER: front
