core-deploy:
  stage: deploy
  tags:
    - ${TAG}
  extends:
    - .deploy-kubectl
    - .releases-branch
  image: $KUBECTL_IMAGE
  needs:
    - core-build-docker
    - version
  environment:
    name: core-${CI_COMMIT_REF_SLUG}
  variables:
    DEPLOY_NAME: core-backend

clabgate-deploy:
  stage: deploy
  tags:
    - ${TAG}
  extends:
    - .deploy-kubectl
    - .releases-branch
  image: $KUBECTL_IMAGE
  needs:
    - clabgate-build-docker
    - version
  environment:
    name: clabgate-${CI_COMMIT_REF_SLUG}
  variables:
    DEPLOY_NAME: clabgate

frontend-deploy:
  stage: deploy
  tags:
    - ${TAG}
  extends:
    - .deploy-kubectl
    - .releases-branch
  image: $KUBECTL_IMAGE
  needs:
    - frontend-build-docker
    - version
  environment:
    name: front-${CI_COMMIT_REF_SLUG}
  variables:
    DEPLOY_NAME: front
