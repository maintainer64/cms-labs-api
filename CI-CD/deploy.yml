core-deploy:
  stage: deploy
  extends:
    - .deploy-base-ssh
    - .releases-branch
  image: ${DOCKER_IMAGE}
  needs:
    - core-build-docker
  environment:
    name: core-${CI_COMMIT_REF_SLUG}
  variables:
    FOLDER: core
    VERSION: ${PIPELINE_VERSION}

frontend-deploy:
  stage: deploy
  extends:
    - .deploy-base-ssh
    - .releases-branch
  image: ${DOCKER_IMAGE}
  needs:
    - frontend-build-docker
  environment:
    name: front-${CI_COMMIT_REF_SLUG}
  variables:
    FOLDER: front
    VERSION: ${PIPELINE_VERSION}
