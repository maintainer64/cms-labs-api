.dependencies:
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .cache/go-build/
      - nextui-dashboard/node_modules/
  before_script:
    - mkdir -p .cache
    - export GOPATH="$CI_PROJECT_DIR/.cache"
    - go mod download
    - yarn --cwd nextui-dashboard install

.registry_login:
  before_script:
    - echo ${REGISTRY_TOKEN} | docker login -u ${REGISTRY_LOGIN} --password-stdin ${REGISTRY_URL}

.deploy-base-ssh:
  # SSH_USER - пользователь ssh
  # SSH_HOST - хост ssh
  # SSH_PORT - порт ssh
  # SSH_PRIVATE_KEY - ключ пользователя приватный ssh в base64
  # FOLDER - папка проекта пользователя
  # VERSION - версия выкатываемой версии PIPELINE
  before_script:
    - echo "Настраиваем SSH"
    - mkdir -p ~/.ssh
    - echo "$(echo ${SSH_PRIVATE_KEY} | base64 -d)" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts
  script:
    - echo "Подключаемся к серверу и выполняем docker-compose"
    - |
      ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST -p $SSH_PORT"
        export VERSION=$VERSION && \
        echo 'Используем версию: $VERSION' && \
        cd $FOLDER && \
        docker compose down && \
        docker compose up -d"
