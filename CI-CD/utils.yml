.dependencies:
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .cache/go-build/
      - nextui-dashboard/node_modules/
  before_script:
    - mkdir -p .cache
    - export GOPATH="$CI_PROJECT_DIR/.cache"
    - go mod download
    - yarn --cwd nextui-dashboard install

.registry_login:
  # REGISTRY_TOKEN - Токен пользователя (в группе)
  # REGISTRY_LOGIN - Логин пользователя
  # REGISTRY_URL - URL хранилища (ex registry.gitlab.com)
  before_script:
    - buildah login -u $REGISTRY_LOGIN -p $REGISTRY_TOKEN $REGISTRY_URL

.deploy-kubectl:
  # K8S_CONFIG - контент в base64 для работы с kubectl
  # DOCKER_PATH_BRANCH - папка для values файлов
  # DEPLOY_NAME - файл (<deployment_name>*.yaml и наименование деплоймента)
  # VERSION - файл с версией из артефактов
  # K8S_NAMESPACE - неймспейс для k8s
  script:
    - VERSION="$(cat ./VERSION)"
    - export VERSION=$VERSION
    - echo "$K8S_CONFIG" | base64 -d > kubeconfig.yaml
    - export KUBECONFIG=$PWD/kubeconfig.yaml
    - cd k8s
    - echo "Подключаемся к серверу и деплоим приложение"
    - helm upgrade --history-max 10 --install $DEPLOY_NAME ./base-chart -n $K8S_NAMESPACE --create-namespace --wait -f ./values/$DOCKER_PATH_BRANCH/$DEPLOY_NAME-values.yaml --set defaultImageTag=$VERSION

.semantic-release:
  # Функция генерации версии пакета
  image: $BUILDER_GO_IMAGE
  variables:
    REPOSITORY: $CI_SERVER_PROTOCOL://gitlab-ci-token:$GITLAB_TOKEN@$CI_SERVER_HOST:$CI_SERVER_PORT/$CI_PROJECT_PATH.git
  script:
    - git remote set-url origin $REPOSITORY
    - rm -rf VERSION
    - |
      if [[ $CI_COMMIT_REF_SLUG = $CI_DEFAULT_BRANCH ]]; then
        npx semantic-release --debug
        git describe --tags --abbrev=0 > VERSION
      else
        echo ${CI_PIPELINE_ID} > VERSION
      fi
    - test -f VERSION
  artifacts:
    paths:
      - VERSION
    expire_in: 1 week

.releases-branch:
  # Ветки для основного pipeline
  only:
    - stage
    - pre
    - master
