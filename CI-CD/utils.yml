.dependencies:
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .cache/go-build/
      - nextui-dashboard/node_modules/
  before_script:
    - mkdir -p .cache
    - export GOPATH="$CI_PROJECT_DIR/.cache"
    - go mod download
    - yarn --cwd nextui-dashboard install

.registry_login:
  # REGISTRY_TOKEN - Токен пользователя (в группе)
  # REGISTRY_LOGIN - Логин пользователя
  # REGISTRY_URL - URL хранилища (ex registry.gitlab.com)
  before_script:
    - echo ${REGISTRY_TOKEN} | docker login -u ${REGISTRY_LOGIN} --password-stdin ${REGISTRY_URL}

.deploy-base-ssh:
  # SSH_USER - пользователь ssh
  # SSH_HOST - хост ssh
  # SSH_PORT - порт ssh
  # SSH_PRIVATE_KEY - ключ пользователя приватный ssh в base64
  # FOLDER - папка проекта пользователя
  # VERSION - файл с версией из артефактов
  before_script:
    - echo "Настраиваем SSH $SSH_USER@$SSH_HOST:$SSH_PORT"
    - mkdir -p ~/.ssh
    - echo "$(echo ${SSH_PRIVATE_KEY} | base64 -d)" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo "SSH настроен"
  script:
    - VERSION="$(cat ./VERSION)"
    - echo "Подключаемся к серверу и выполняем docker-compose"
    - ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST -p $SSH_PORT "export VERSION=$VERSION && echo 'Используем версию $VERSION' && cd $FOLDER && docker compose pull && docker compose up -d"

.semantic-release:
  # Функция генерации версии пакета
  image: $GO_BASE_CI_IMAGE:latest
  variables:
    REPOSITORY: $CI_SERVER_PROTOCOL://gitlab-ci-token:$GITLAB_TOKEN@$CI_SERVER_HOST:$CI_SERVER_PORT/$CI_PROJECT_PATH.git
  script:
    - git remote set-url origin $REPOSITORY
    - rm -rf VERSION
    - |
      if [[ $CI_COMMIT_REF_SLUG = $CI_DEFAULT_BRANCH ]]; then
        semantic-release --debug
      else
        echo ${CI_PIPELINE_ID} > VERSION
      fi
    - test -f VERSION
  artifacts:
    paths:
      - VERSION
    expire_in: 1 week

.releases-branch:
  # Ветки для основного pipeline
  only:
    - stage
    - pre
    - master
