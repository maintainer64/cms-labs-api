builder-docker-runner:
  stage: test
  extends: .registry_login
  image: ${DOCKER_IMAGE}
  services:
    - ${DOCKER_IMAGE}-dind
  script:
    - echo "Building Docker image..."
    - docker build --no-cache -t $GO_BASE_CI_IMAGE:latest ./CI-CD
    - echo "Pushing Docker image to GitLab Registry..."
    - docker push $GO_BASE_CI_IMAGE:latest
    - echo "Deploying application..."
  when: manual
