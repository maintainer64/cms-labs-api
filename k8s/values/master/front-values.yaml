releasePrefix: "-"

defaultImage: harbor.cmslabs.ru/cms-labs/api-modules/frontend/master
defaultImageTag: ""

generic:
  usePredefinedAffinity: false

ingresses:
  auth.k8s.cmslabs.ru:
    ingressClassName: nginx
    hosts:
    - paths:
      - serviceName: front
        servicePort: http
    extraTls:
    - hosts:
      - auth.k8s.cmslabs.ru
      secretName: "ingress-nginx/wildcard-cert-tls"

services:
  front:
    ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http

deployments:
  front:
    replicas: 2
    containers:
    - name: front
      envSecrets:
      - front-env-list
      ports:
      - name: http
        containerPort: 80
      resources:
        requests:
          memory: "64Mi"
          cpu: "50m"
        limits:
          memory: "128Mi"
          cpu: "100m"
      startupProbe:
        httpGet:
          path: /
          port: http
        timeoutSeconds: 1
        periodSeconds: 10
        successThreshold: 1
        failureThreshold: 12
      livenessProbe:
        httpGet:
          path: /
          port: http
        timeoutSeconds: 1
        periodSeconds: 10
        successThreshold: 1
        failureThreshold: 6
      readinessProbe:
        httpGet:
          path: /
          port: http
        timeoutSeconds: 1
        periodSeconds: 10
        successThreshold: 1
        failureThreshold: 2