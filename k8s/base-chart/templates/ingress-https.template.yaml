{{- if eq .Release.Name "front" }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cms-labs
  namespace: {{ .Release.Namespace | quote }}
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: cilium
      sectionName: https
  hostnames:
    - {{ .Values.ingressHostname | quote}}
  rules:
    - backendRefs:
        - name: {{ .Values.ingressServiceName }}
          port: 80
{{- end }}
