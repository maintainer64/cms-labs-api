---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cmslabs-redirect
  namespace: {{ .Release.Namespace | quote }}
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: cilium
      sectionName: http
  hostnames:
    - {{ .Values.ingressHostname | quote}}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
